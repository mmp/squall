name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.21', '1.22', '1.23']
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        lfs: false

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go }}-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      shell: bash
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go == '1.23'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.txt
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build
      run: go build -v ./...

    - name: Build cmd/gribinfo
      run: go build -v ./cmd/gribinfo

    - name: Build cmd/benchmark
      run: go build -v ./cmd/benchmark

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        lfs: false

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Get wgrib2 and g2c latest commit hashes
      id: wgrib2-version
      run: |
        WGRIB2_COMMIT=$(git ls-remote https://github.com/NOAA-EMC/wgrib2.git HEAD | cut -f1)
        G2C_COMMIT=$(git ls-remote https://github.com/NOAA-EMC/NCEPLIBS-g2c.git HEAD | cut -f1)
        echo "commit=$WGRIB2_COMMIT-$G2C_COMMIT" >> $GITHUB_OUTPUT
        echo "wgrib2 latest commit: $WGRIB2_COMMIT, g2c latest commit: $G2C_COMMIT"

    - name: Cache wgrib2
      id: cache-wgrib2
      uses: actions/cache@v4
      with:
        path: ~/wgrib2
        key: wgrib2-jpeg2000-${{ runner.os }}-${{ steps.wgrib2-version.outputs.commit }}

    - name: Install wgrib2 dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc make libopenjp2-7-dev libpng-dev zlib1g-dev

    # wgrib2 decodes JPEG 2000 (and PNG) packing with NCEP's g2c library,
    # which must be built with OpenJPEG or JasPer.
    - name: Build wgrib2 from source, with JPEG 2000 support
      if: steps.cache-wgrib2.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 https://github.com/NOAA-EMC/NCEPLIBS-g2c.git $HOME/g2c-src
        cmake -S $HOME/g2c-src -B $HOME/g2c-src/build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=$HOME/wgrib2 -DCMAKE_INSTALL_RPATH=$HOME/wgrib2/lib \
          -DUSE_OpenJPEG=ON -DUSE_Jasper=OFF -DUSE_PNG=ON -DUTILS=OFF
        cmake --build $HOME/g2c-src/build -j$(nproc)
        cmake --install $HOME/g2c-src/build

        git clone --depth 1 https://github.com/NOAA-EMC/wgrib2.git $HOME/wgrib2-src
        cmake -S $HOME/wgrib2-src -B $HOME/wgrib2-src/build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=$HOME/wgrib2 -DCMAKE_INSTALL_RPATH=$HOME/wgrib2/lib \
          -DCMAKE_PREFIX_PATH=$HOME/wgrib2 -DUSE_G2CLIB=ON -DBUILD_SHARED_LIB=OFF
        cmake --build $HOME/wgrib2-src/build -j$(nproc)
        cmake --install $HOME/wgrib2-src/build

    - name: Check wgrib2 JPEG 2000 support
      run: |
        # wgrib2 -version and -config return a non-zero exit code
        $HOME/wgrib2/bin/wgrib2 -version || true
        config=$($HOME/wgrib2/bin/wgrib2 -config || true)
        echo "$config" | grep "Supported decoding"
        echo "$config" | grep -q jpeg2000

    - name: Add wgrib2 to PATH
      run: echo "$HOME/wgrib2/bin" >> $GITHUB_PATH

    - name: Download CONUS HRRR file from NOAA
      run: |
        mkdir -p testgribs
        # Download the large CONUS HRRR file (stored in LFS in the repo)
        # This replaces the LFS version to avoid bandwidth quota
        curl -f -o testgribs/hrrr.20251015-conus-hrrr.t11z.wrfprsf00.grib2 \
          "https://storage.googleapis.com/high-resolution-rapid-refresh/hrrr.20240101/conus/hrrr.t00z.wrfsubhf00.grib2" \
          || echo "Warning: Could not download test file from NOAA"

    - name: Run integration tests
      run: go test -v -run TestIntegration ./...
